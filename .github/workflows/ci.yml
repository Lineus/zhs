name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint, Format & Type Check ─────────────────────────────────
  check:
    name: Lint & Type Check
    runs-on: ubuntu-24.04  # 固定镜像，避免 ubuntu-latest 迁移（2026-10-19 起为 Ubuntu 26）带来环境漂移
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"  # 最低支持版本，与 ruff/mypy 的 target py313 对齐

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint check (src + tests)
        run: uv run ruff check src/ tests/

      - name: Ruff format check (src + tests)
        run: uv run ruff format --check src/ tests/

      - name: Mypy strict check (src + tests)
        run: uv run mypy src/ tests/

  # ── Tests & Coverage ──────────────────────────────────────────
  test:
    name: Tests & Coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 requires-python 区间保持一致
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4


      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run all tests with coverage
        run: uv run pytest --cov=zhs --cov-report=term-missing --cov-report=html -q

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  # ── 聚合门禁 ──────────────────────────────────────────────────
  # 分支规则集只能引用固定名称的必需检查，而 matrix 展开后名字会带版本后缀
  # （Tests & Coverage (py3.13) / (py3.14)）。此 job 名称固定、汇总 matrix 结果，
  # 以后增删 python-version 都无需改 ruleset。
  tests-gate:
    name: Tests & Coverage
    needs: [test]
    if: always()  # test 失败时也要运行，否则该检查会被判成 skipped 而不是 failed
    runs-on: ubuntu-24.04
    steps:
      - name: Verify test matrix succeeded
        if: needs.test.result != 'success'
        run: |
          echo "::error::test matrix 结果：${{ needs.test.result }}"
          exit 1

  # ── PyPI 用户路径 ─────────────────────────────────────────────
  # 模拟真实用户：把打好的 wheel 装进干净环境，依赖从 PyPI 全新解析
  user-install:
    name: Install From PyPI (py3.14)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 取允许区间的上界：新版 Python / 新版依赖缺预编译轮子会最先在这里暴露
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"

      - name: Build wheel
        run: uv build

      # 等价于用户的 `pip install zhs`：干净 venv + 全新解析，不读 uv.lock
      - name: Install the wheel with fresh resolution
        run: |
          uv venv /tmp/zhs-user
          uv pip install --python /tmp/zhs-user/bin/python dist/*.whl

      - name: Smoke test the CLI
        run: /tmp/zhs-user/bin/zhs --version
